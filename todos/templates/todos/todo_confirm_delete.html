<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Todo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="{% url 'todo_dashboard' %}"
               class="flex items-center gap-2 text-xl font-bold">

                <div class="w-9 h-9 rounded-xl bg-indigo-600
                            flex items-center justify-center">

                    <i data-lucide="check-square" class="w-5 h-5"></i>

                </div>

                Todo
            </a>

            <a href="{% url 'todo_dashboard' %}"
               class="text-sm text-slate-400 hover:text-white transition">

                Dashboard

            </a>

        </div>
    </nav>


    <!-- Main -->
    <main class="min-h-[calc(100vh-73px)] flex items-center justify-center px-6">

        <div class="w-full max-w-md">

            <!-- Delete Card -->
            <div class="bg-slate-900/80 border border-slate-800
                        rounded-2xl p-8 shadow-2xl text-center">

                <!-- Icon -->
                <div class="w-16 h-16 mx-auto mb-6
                            rounded-full
                            bg-red-500/10
                            border border-red-500/20
                            flex items-center justify-center">

                    <i data-lucide="trash-2"
                       class="w-7 h-7 text-red-400"></i>

                </div>


                <!-- Heading -->
                <h1 class="text-2xl font-bold mb-3">
                    Delete Todo?
                </h1>

                <p class="text-slate-400 mb-6">
                    Are you sure you want to delete this todo?
                </p>


                <!-- Todo Preview -->
                <div class="bg-slate-950/70
                            border border-slate-800
                            rounded-xl
                            p-4
                            mb-8
                            text-left">

                    <p class="text-white font-medium">
                        {{ object.title }}
                    </p>

                    {% if object.description %}
                        <p class="text-sm text-slate-500 mt-1">
                            {{ object.description }}
                        </p>
                    {% endif %}

                </div>


                <!-- Form -->
                <form method="POST" class="flex gap-3">

                    {% csrf_token %}

                    <a href="{% url 'todo_dashboard' %}"
                       class="flex-1 py-3 rounded-xl
                              border border-slate-700
                              text-slate-300
                              hover:bg-slate-800
                              transition">

                        Cancel

                    </a>


                    <button type="submit"
                            class="flex-1 py-3 rounded-xl
                                   bg-red-600
                                   hover:bg-red-500
                                   text-white
                                   font-medium
                                   flex items-center
                                   justify-center
                                   gap-2
                                   transition">

                        <i data-lucide="trash-2"
                           class="w-4 h-4"></i>

                        Delete

                    </button>

                </form>

            </div>

        </div>

    </main>


    <script>
        lucide.createIcons();
    </script>

</body>
</html>
